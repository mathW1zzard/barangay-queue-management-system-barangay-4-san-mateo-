<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 - First Time Setup</title>
</head>
<body>
    <h3 style="color: darkorange;">FIRST-TIME SETUP • STEP 1 OF 2</h3>
    <h1>Create Your Account</h1>
    <p>This will be the only account for this system. Choose a username and password you'll remember.</p>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/setup" method="post">
        <label>Username</label><br>
        <input type="text" name="username" placeholder="admin.secretary" required><br><br>

        <label>Password</label><br>
        <input type="password" name="password" required><br><br>

        <label>Confirm Password</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <small>Use at least 8 characters. This password protects all client records.</small><br><br>

        <button type="submit">Continue</button>
</body>
</html>
